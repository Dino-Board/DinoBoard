<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DinoBoard</title>
<link rel="stylesheet" href="/static/common.css">
<style>
.home-stage {
  padding: 60px 20px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
.home-stage h2 {
  font-size: 32px;
  font-weight: 800;
  color: #0f3554;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.dino-logo {
  width: 56px;
  height: 56px;
  display: block;
}
.dino-logo .body { fill: #2f9e7e; }
.dino-logo .belly { fill: #b8e0c2; }
.dino-logo .spike { fill: #f5c430; }
.dino-logo .eye { fill: #0f3554; }
.dino-logo .eye-shine { fill: #ffffff; }
.dino-logo .mouth { fill: none; stroke: #0f3554; stroke-width: 2; stroke-linecap: round; }
.lang-toggle {
  font-size: 13px;
  font-weight: 600;
  padding: 4px 12px;
  border: 1px solid #0f3554;
  background: #ffffff;
  color: #0f3554;
  border-radius: 999px;
  cursor: pointer;
  line-height: 1.2;
}
.lang-toggle:hover { background: #0f3554; color: #ffffff; }
.home-subtitle {
  color: #64748b;
  margin-bottom: 32px;
  font-size: 15px;
}
.game-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  width: min(1060px, 94vw);
}
.game-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 16px;
  background: #f8fafc;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  text-decoration: none;
  color: #111827;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.game-card:hover:not(.disabled) {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
}
.game-card.disabled {
  opacity: 0.45;
  cursor: default;
}
.game-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}
.game-info {
  font-size: 13px;
  color: #64748b;
}
.badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #e0e7ff;
  color: #3730a3;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
}
.ai-table {
  margin-top: 40px;
  border-collapse: collapse;
  font-size: 14px;
  width: min(1060px, 94vw);
}
.ai-table th, .ai-table td {
  border: 1px solid #d1d5db;
  padding: 8px 14px;
  text-align: center;
}
.ai-table th {
  background: #f1f5f9;
  font-weight: 600;
  color: #0f3554;
}
.ai-table td:first-child {
  text-align: left;
  font-weight: 600;
}
.ai-table-note {
  margin-top: 8px;
  font-size: 12px;
  color: #64748b;
  width: min(1060px, 94vw);
}
</style>
</head>
<body>
<main class="home-stage">
  <h2>
    <svg class="dino-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon class="body" points="4,32 22,24 22,40"/>
      <rect class="body" x="18" y="24" width="28" height="18" rx="4"/>
      <rect class="body" x="38" y="12" width="20" height="18" rx="6"/>
      <polygon class="spike" points="44,12 48,5 52,12"/>
      <polygon class="spike" points="22,24 26,17 30,24"/>
      <polygon class="spike" points="30,24 34,17 38,24"/>
      <rect class="body" x="22" y="40" width="6" height="6" rx="2"/>
      <rect class="body" x="34" y="40" width="6" height="6" rx="2"/>
      <rect class="body" x="20" y="44" width="10" height="4" rx="2"/>
      <rect class="body" x="32" y="44" width="10" height="4" rx="2"/>
      <rect class="body" x="42" y="30" width="3" height="6" rx="1"/>
      <ellipse class="belly" cx="32" cy="35" rx="10" ry="5"/>
      <circle class="eye" cx="50" cy="19" r="2.2"/>
      <circle class="eye-shine" cx="50.8" cy="18.2" r="0.7"/>
      <path class="mouth" d="M52 24 Q 55 25.5 57 23.5"/>
    </svg>
    DinoBoard
    <button id="lang-toggle" class="lang-toggle" type="button"></button>
  </h2>
  <div id="home-subtitle" class="home-subtitle"></div>
  <div id="games" class="game-grid"></div>

  <table id="ai-table" class="ai-table">
    <thead>
      <tr><th id="th-game"></th><th>2p</th><th>3p</th><th>4p</th></tr>
    </thead>
    <tbody id="ai-table-body"></tbody>
  </table>
  <div id="ai-table-note" class="ai-table-note"></div>
</main>

<script type="module">
import { t, getLang, setLang } from '/static/general/i18n.js';
import '/static/general/i18n_strings.js';

const lang = getLang();
document.title = 'DinoBoard';
document.getElementById('home-subtitle').textContent = t('home.subtitle');

const langBtn = document.getElementById('lang-toggle');
langBtn.textContent = t('home.lang_btn');
langBtn.title = t('home.lang_btn_title');
langBtn.addEventListener('click', () => setLang(lang === 'zh' ? 'en' : 'zh'));

async function init() {
  const resp = await fetch('/api/games/available');
  const data = await resp.json();
  const grid = document.getElementById('games');

  for (const game of data.games) {
    const card = document.createElement('a');
    card.className = 'game-card' + (game.has_web ? '' : ' disabled');
    card.href = game.has_web ? '/games/' + game.game_id + '/' : '#';
    if (!game.has_web) {
      card.addEventListener('click', function(e) { e.preventDefault(); });
    }

    const title = document.createElement('div');
    title.className = 'game-title';
    const nameEn = game.display_name_en;
    title.textContent = (lang === 'en' && nameEn) ? nameEn : game.display_name;

    const info = document.createElement('div');
    info.className = 'game-info';
    const p = game.players;
    info.textContent = p.min === p.max
        ? t('home.players_exact', { n: p.min })
        : t('home.players_range', { min: p.min, max: p.max });

    if (!game.has_web) {
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = t('home.coming_soon');
      card.appendChild(badge);
    }

    card.appendChild(title);
    card.appendChild(info);
    grid.appendChild(card);
  }
}
init();

document.getElementById('th-game').textContent = t('home.table_game');
document.getElementById('ai-table-note').textContent = t('home.table_note');

const S = t('home.strength_strong');
const M = t('home.strength_medium');
const R = t('home.strength_random');
const AI_DATA = [
  ['TicTacToe',  S+'/✓', '—',    '—'],
  ['Quoridor',   S+'/✓', '—',    '—'],
  ['Azul',       M+'/✓', M+'/✗', M+'/✗'],
  ['Splendor',   M+'/✓', M+'/✗', M+'/✗'],
  ['Love Letter',R+'/✓', R+'/✓', R+'/✓'],
  ['Coup',       R+'/✓', R+'/✗', R+'/✓'],
  ['6 nimmt!',   S+'/✓', S+'/✗', S+'/✗'],
  ["Liar's Dice",M+'/✓', M+'/✓', M+'/✓'],
  ['Harmonies',  M+'/✗', M+'/✗', M+'/✗'],
  ['Jaipur',     M+'/✓', '—',    '—'],
  ['Carcassonne',M+'/✗', '—',    '—'],
  ['Maskmen',    '—',    R+'/✓', R+'/✗'],
];
const tbody = document.getElementById('ai-table-body');
for (const [name, c2, c3, c4] of AI_DATA) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${name}</td><td>${c2}</td><td>${c3}</td><td>${c4}</td>`;
  tbody.appendChild(tr);
}
</script>
</body>
</html>
